name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ctype,curl,dom,fileinfo,filter,hash,mbstring,openssl,pdo,session,sqlite3,pdo_sqlite,tokenizer,xml,zip
          coverage: none
          tools: composer

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts 2>&1 | tee composer-install.log

      - name: Prepare environment
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate --force
          php artisan package:discover --ansi

      - name: Lint PHP source
        run: |
          set -o pipefail
          find app bootstrap config database routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l 2>&1 | tee php-lint.log

      - name: Verify application configuration
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan about 2>&1 | tee artisan-about.log

      - name: Run migrations
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan migrate --force 2>&1 | tee migration.log

      - name: Verify routes
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan route:list 2>&1 | tee routes.log

      - name: Run tests with detailed output
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
        run: php artisan test --verbose --colors=never 2>&1 | tee phpunit.log

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: |
            composer-install.log
            php-lint.log
            artisan-about.log
            migration.log
            routes.log
            phpunit.log
          if-no-files-found: ignore
